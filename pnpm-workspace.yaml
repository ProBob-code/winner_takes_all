packages:
  - "apps/*"
  - "packages/*"

# Dependencies permitted to run install scripts.
#
# TWO KEYS, ON PURPOSE. pnpm 9 — which CI uses — reads `onlyBuiltDependencies`.
# pnpm 11 — which this machine has — reads `allowBuilds` and ignores the list,
# so with only the list present it refuses every build script with
# ERR_PNPM_IGNORED_BUILDS and then writes an `allowBuilds` stub whose values are
# the literal string "set this to true or false". That stub makes every
# non-interactive `pnpm install` / `pnpm -r` stop and prompt, which is what
# broke `pnpm build` (and so the OpenNext build) on this machine.
#
# Filling the stub in with real booleans is the fix. Keeping both keys means one
# file works for pnpm 9 and pnpm 11 without either needing `pnpm approve-builds`
# run by hand. If pnpm adds a package to the stub again, give it a real boolean
# here rather than leaving the placeholder.
#
# All five are build tools whose postinstall scripts compile or fetch a native
# binary, and all five are needed: esbuild and workerd for wrangler, sharp for
# Next's image handling, deasync and vercel transitively.
allowBuilds:
  deasync: true
  esbuild: true
  sharp: true
  vercel: true
  workerd: true
  # Pulled in by @huggingface/transformers, which the frontend uses only in
  # the browser (on-device voice scoring). onnxruntime-node's script downloads
  # a native Node binary nothing here runs, and protobufjs's is a version
  # nag. Neither is needed, so neither runs.
  onnxruntime-node: false
  protobufjs: false

onlyBuiltDependencies:
  - esbuild
  - sharp
  - workerd
  - deasync
  - vercel
