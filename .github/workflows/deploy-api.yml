name: Deploy API to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'packages/contracts/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Quality gate: a build that doesn't typecheck or pass tests must never
      # reach production. These steps fail the job (and skip deploy) on error.
      - name: Typecheck
        run: pnpm --filter api typecheck

      - name: Test
        run: pnpm --filter api test

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: 'apps/api'
          command: deploy
          # Only list secrets that exist as GitHub repository secrets. Anything
          # named here is overwritten on every deploy, so a name without a
          # matching repository secret would blank a working credential.
          #
          # The RAZORPAY_* secrets are deliberately absent: they are managed
          # directly in the Cloudflare dashboard, and listing them here pushed
          # empty values over them on each deploy. To move them into this flow,
          # add them as repository secrets first, then add their names back.
          secrets: |
            REALTIME_APP_ID
            REALTIME_APP_SECRET
            BROADCAST_TOKEN_SECRET
        env:
          # Cloudflare Realtime SFU credentials for live match streaming.
          REALTIME_APP_ID: ${{ secrets.REALTIME_APP_ID }}
          REALTIME_APP_SECRET: ${{ secrets.REALTIME_APP_SECRET }}
          # Signs the short-lived broadcast tokens carried by match QR codes.
          BROADCAST_TOKEN_SECRET: ${{ secrets.BROADCAST_TOKEN_SECRET }}
