name = "winnertakesall"
main = "src/index.ts"
compatibility_date = "2024-09-01"
compatibility_flags = ["nodejs_compat"]

# The API on the site's own domain. Session cookies set by workers.dev are
# third-party to winnertakesall.live, and Safari (every browser on an iPhone)
# drops those, so iPhone users were logged out the moment they logged in.
# From api.winnertakesall.live the same cookies are first-party.
routes = [{ pattern = "api.winnertakesall.live", custom_domain = true }]
# Kept on as well: pages.dev previews and older pages still call it.
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "winner-takes-all-db"
database_id = "789d6ae3-5715-499c-b6b5-b069ec5eee51"

# Live camera feed registry, one instance per match. Durable Object storage is
# used instead of KV because broadcaster heartbeats and viewer polling are far
# too frequent for KV's daily write allowance.
[[durable_objects.bindings]]
name = "MATCH_FEEDS"
class_name = "MatchFeeds"

[[migrations]]
tag = "v1-match-feeds"
new_sqlite_classes = ["MatchFeeds"]

# Online 8-ball. "lobby" pairs players; "table:<uuid>" relays one game and
# decides its result, which the API reads before paying anything.
[[durable_objects.bindings]]
name = "POOL_ROOMS"
class_name = "PoolRooms"

[[migrations]]
tag = "v2-pool-rooms"
new_sqlite_classes = ["PoolRooms"]

# Imposter, the party game. "room:<CODE>" runs one room: it deals the words,
# keeps the clock, plays the bots, counts the votes and pays the coins.
[[durable_objects.bindings]]
name = "IMPOSTER_ROOMS"
class_name = "ImposterRooms"

[[migrations]]
tag = "v3-imposter-rooms"
new_sqlite_classes = ["ImposterRooms"]

[[kv_namespaces]]
binding = "SESSIONS"
id = "788ab68ad9454e4ea7f2519b32792722"

# Non-secret configuration only. Secrets MUST be set via:
#   wrangler secret put RAZORPAY_KEY_ID
#   wrangler secret put RAZORPAY_KEY_SECRET
#   wrangler secret put RAZORPAY_WEBHOOK_SECRET
#   wrangler secret put REALTIME_APP_ID
#   wrangler secret put REALTIME_APP_SECRET
#   wrangler secret put BROADCAST_TOKEN_SECRET
# Never put credentials in [vars] — this file is committed to git.
[vars]
ALLOWED_ORIGINS = "https://winnertakesall.live,https://www.winnertakesall.live,https://winner-takes-all.pages.dev,http://localhost:3000"
# Cloudflare Realtime SFU host. Override if your deployment uses a different
# origin; the app id is appended as /apps/<REALTIME_APP_ID>.
REALTIME_API_BASE = "https://rtc.live.cloudflare.com/v1"
# Origin used to build the scannable broadcast URL placed in match QR codes.
PUBLIC_APP_ORIGIN = "https://winnertakesall.live"
# Sign in with Google. A client ID is public (the browser sees it), unlike
# the client secret, which this app never uses.
GOOGLE_CLIENT_ID = "712377550396-0ne3rpia1ec07jbdboscfk7kd0cf3a5t.apps.googleusercontent.com"

# Opens the next week of every active series once its date has passed. Hourly
# rather than daily so a season set to open at 20:00 does so the same evening;
# the run is a no-op when nothing is due.
[triggers]
crons = ["0 * * * *"]
